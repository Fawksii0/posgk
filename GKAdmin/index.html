<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e3a81f">
  <title>G&amp;K Admin</title>
  <link rel="icon" href="assets/emblem-reference.png">
  <link rel="stylesheet" href="styles.css?v=api-5">
  <link rel="stylesheet" href="../shared/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="../shared/gk-map.css?v=2">
  <script src="../shared/vendor/leaflet/leaflet.js" defer></script>
  <script src="../shared/gk-map.js?v=2" defer></script>
  <script src="../shared/gk-api.js?v=api5" defer></script>
  <script src="../shared/gk-push.js?v=2" defer></script>
  <script src="../shared/gk-item-name.js?v=2" defer></script>
  <script src="../shared/gk-receipt.js?v=10" defer></script>
  <script src="data.js?v=api-3" defer></script>
  <script src="store.js?v=api-11" defer></script>
  <script src="../shared/vendor/qrcode.min.js" defer></script>
  <script src="escpos.js?v=23" defer></script>
  <script src="app.js?v=api-12" defer></script>
</head>
<body>
  <div id="login-view" class="login-view" hidden></div>

  <div id="shell" class="shell" hidden>
    <aside id="sidebar" class="sidebar" aria-label="Navigation principale"></aside>
    <div id="scrim" class="scrim" data-action="close-nav" hidden></div>
    <div class="shell-main">
      <header class="topbar">
        <button class="icon-button nav-toggle" type="button" data-action="open-nav" aria-label="Ouvrir le menu" aria-controls="sidebar"></button>
        <h1 id="page-title" class="page-title">Tableau de bord</h1>
        <label class="search-box" for="global-search">
          <span id="search-icon" aria-hidden="true"></span>
          <input id="global-search" type="search" placeholder="Rechercher une commande, un client…" autocomplete="off" aria-label="Recherche globale">
        </label>
        <div class="topbar-actions">
          <label id="branch-switch-wrap" class="branch-switch-wrap" hidden>
            <span>Restaurant</span>
            <select id="branch-select" aria-label="Restaurant sélectionné"></select>
          </label>
          <div class="pop-wrap">
            <button id="bell-btn" class="icon-button" type="button" data-action="toggle-bell" aria-label="Notifications" aria-haspopup="true" aria-expanded="false"></button>
            <div id="bell-pop" class="popover" hidden></div>
          </div>
          <div class="pop-wrap">
            <button id="user-btn" class="user-chip" type="button" data-action="toggle-user" aria-haspopup="true" aria-expanded="false"></button>
            <div id="user-pop" class="popover" hidden></div>
          </div>
        </div>
      </header>
      <div id="notice-bar" class="notice-bar"></div>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="print-area" class="print-area" aria-hidden="true"></div>
</body>
</html>
