project_id = "gk-api"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:8800"
additional_redirect_urls = ["http://127.0.0.1:8800"]

[auth.sms]
enable_signup = false

[auth.email]
enable_signup = true
enable_confirmations = false

[functions.gk-api]
verify_jwt = false
