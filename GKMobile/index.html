<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e3a81f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="G&K Food" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="description" content="Order your G&K Food favorites for pickup or delivery." />
    <title>G&K Food — Good food. Great moments.</title>
    <link rel="stylesheet" href="./styles.css?v=43" />
    <link rel="stylesheet" href="../shared/gk-chat.css?v=1" />
    <link rel="stylesheet" href="../shared/gk-live-scene.css?v=1" />
  </head>
  <body>
    <div class="splash is-playing" id="splash" aria-hidden="false">
      <div class="splash-mark"><img src="./assets/emblem-reference.png" alt="G&K Food" /></div>
    </div>
    <div class="app-frame">
      <header class="app-header">
        <button class="brand-lockup" id="home-brand" type="button" aria-label="G&K Food home">
          <img src="./assets/emblem-reference.png" alt="" class="brand-logo" />
        </button>
        <button class="location-button" id="location-button" type="button" aria-label="Choisir une adresse de livraison">
          <small>Livraison à</small>
          <strong><span class="location-icon" aria-hidden="true" data-icon="pin"></span><span id="location-label">Choisir une adresse</span><span class="location-chevron" aria-hidden="true" data-icon="chevronDown"></span></strong>
        </button>
        <button class="icon-button" id="notif-button" type="button" aria-label="Notifications">
          <span aria-hidden="true" data-icon="bell"></span><i class="dot" aria-hidden="true"></i>
        </button>
      </header>

      <main id="app-main" tabindex="-1"></main>

      <div class="live-bar" id="live-bar" hidden></div>

      <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-button active" data-view="home" type="button" aria-current="page">
          <span class="nav-icon" aria-hidden="true" data-icon="home"></span><span>Accueil</span>
        </button>
        <button class="nav-button" data-view="menu" type="button">
          <span class="nav-icon" aria-hidden="true" data-icon="compass"></span><span>Explorer</span>
        </button>
        <button class="nav-button" data-view="cart" type="button">
          <span class="nav-icon" aria-hidden="true" data-icon="bag"></span><span class="nav-badge" id="nav-cart-count" hidden>0</span><span>Panier</span>
        </button>
        <button class="nav-button" data-view="orders" type="button">
          <span class="nav-icon" aria-hidden="true" data-icon="receipt"></span><span>Commandes</span>
        </button>
        <button class="nav-button" data-view="profile" type="button">
          <span class="nav-icon" aria-hidden="true" data-icon="user"></span><span>Profil</span>
        </button>
      </nav>
    </div>

    <div class="overlay" id="overlay" hidden>
      <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></section>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="../shared/gk-api.js?v=api3" defer></script>
    <script src="../shared/gk-sound.js" defer></script>
    <script src="../shared/gk-chat.js?v=1" defer></script>
    <script src="./data.js" defer></script>
    <script src="./store.js?v=42" defer></script>
    <script type="module" src="./motion-ui.js?v=40"></script>
    <script type="module" src="../shared/gk-motion-live.js?v=1"></script>
    <script src="./app.js?v=43" defer></script>
  </body>
</html>
