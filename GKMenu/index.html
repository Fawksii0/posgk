<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e3a81f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="G&K Menu" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="description" content="Menu sur place G&K Food." />
    <title>G&K Menu — Sur place</title>
    <link rel="icon" href="./assets/emblem-reference.png" />
    <link rel="stylesheet" href="./styles.css?v=8" />
  </head>
  <body>
    <div class="app-frame">
      <header class="app-header">
        <img class="brand-mark" src="./assets/emblem-reference.png" alt="G&amp;K Food" width="44" height="44" />
        <div class="header-copy">
          <small id="header-kicker">Menu sur place</small>
          <strong id="header-title">G&amp;K Food</strong>
        </div>
        <button class="icon-button" id="change-table" type="button" hidden aria-label="Changer de table">Table</button>
      </header>
      <main id="app-main" tabindex="-1"></main>
      <div class="action-dock" id="action-dock" hidden>
        <button class="gold-button" type="button" data-action="open-cart">
          <span aria-hidden="true" data-icon="bag"></span>
          <span id="cart-label">Commander</span>
        </button>
        <button class="outline-button" type="button" data-action="call-waiter">
          <span aria-hidden="true" data-icon="bell"></span>
          Appeler le serveur
        </button>
      </div>
    </div>
    <div class="overlay" id="overlay" hidden>
      <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></section>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script src="../shared/gk-api.js?v=api4" defer></script>
    <script src="./data.js?v=2" defer></script>
    <script type="module" src="./motion-ui.js?v=1"></script>
    <script src="./app.js?v=8" defer></script>
  </body>
</html>
