<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a120c" />
    <title>G&amp;K Food — System status</title>
    <meta name="description" content="Availability of the G&amp;K Food API, apps, and incidents." />
    <link rel="icon" href="./assets/emblem-reference.png" />
    <link rel="stylesheet" href="./styles.css?v=3" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="https://gkfood.store/">
        <img src="./assets/emblem-reference.png" alt="" width="44" height="44" />
        <span>
          <small>G&amp;K Food</small>
          <strong>Status</strong>
        </span>
      </a>
      <button class="refresh" type="button" id="refresh" aria-label="Refresh">Refresh</button>
    </header>

    <main>
      <section class="hero" id="summary" aria-live="polite">
        <p class="eyebrow">status.gkfood.store</p>
        <h1 id="headline">Checking…</h1>
        <p id="lede">Running live checks on G&amp;K services.</p>
        <p class="checked" id="checked">—</p>
      </section>

      <section aria-labelledby="systems-title">
        <h2 id="systems-title">Systems</h2>
        <ul class="checks" id="checks"></ul>
      </section>

      <section aria-labelledby="incidents-title">
        <h2 id="incidents-title">Incidents</h2>
        <div id="incidents"></div>
      </section>

      <section aria-labelledby="bugs-title">
        <h2 id="bugs-title">Known issues</h2>
        <div id="bugs"></div>
      </section>
    </main>

    <footer>
      <p>Probes refresh every minute. Times are round-trip from your browser to a tiny endpoint, not a full page download.</p>
      <p><a href="https://gkfood.store/">gkfood.store</a></p>
    </footer>
    <script src="./app.js?v=12"></script>
  </body>
</html>
