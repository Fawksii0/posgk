<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a120c" />
    <title>G&amp;K Food — État des systèmes</title>
    <meta name="description" content="Disponibilité de l'API, des applications et des incidents G&K Food." />
    <link rel="icon" href="./assets/emblem-reference.png" />
    <link rel="stylesheet" href="./styles.css?v=2" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="https://gkfood.store/">
        <img src="./assets/emblem-reference.png" alt="" width="44" height="44" />
        <span>
          <small>G&amp;K Food</small>
          <strong>Status</strong>
        </span>
      </a>
      <button class="refresh" type="button" id="refresh" aria-label="Actualiser">Actualiser</button>
    </header>

    <main>
      <section class="hero" id="summary" aria-live="polite">
        <p class="eyebrow">status.gkfood.store</p>
        <h1 id="headline">Vérification…</h1>
        <p id="lede">Contrôle en cours des services G&amp;K.</p>
        <p class="checked" id="checked">—</p>
      </section>

      <section aria-labelledby="systems-title">
        <h2 id="systems-title">Systèmes</h2>
        <ul class="checks" id="checks"></ul>
      </section>

      <section aria-labelledby="incidents-title">
        <h2 id="incidents-title">Incidents</h2>
        <div id="incidents"></div>
      </section>

      <section aria-labelledby="bugs-title">
        <h2 id="bugs-title">Anomalies connues</h2>
        <div id="bugs"></div>
      </section>
    </main>

    <footer>
      <p>Les sondes relancent automatiquement chaque minute. Les applications sont testées depuis votre navigateur.</p>
      <p><a href="https://gkfood.store/">gkfood.store</a></p>
    </footer>
    <script src="./app.js?v=4"></script>
  </body>
</html>
